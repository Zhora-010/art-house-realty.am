<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arthause Realty — Недвижимость в Гюмри</title>
<meta name="description" content="Купить и продать квартиру в Гюмри. Лучшие предложения недвижимости в Армении.">
<meta property="og:title" content="Arthause Realty">
<meta property="og:description" content="Лучшие предложения недвижимости в Армении">
<meta property="og:type" content="website">
<style>
:root{--bg:#eef0f1;--card:#fff;--ink:#1d2226;--mute:#5d676e;--accent:#2f5d73;--line:#d5dade}
@media (prefers-color-scheme:dark){:root{--bg:#15191c;--card:#1e2327;--ink:#e8ecee;--mute:#9aa5ab;--accent:#7fb2c9;--line:#2e353a}}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;border-bottom:1px solid var(--line)}
.logo{font-size:1.4rem;font-weight:700;text-decoration:none}
nav a{margin-left:20px;text-decoration:none;color:var(--mute);font-family:system-ui,sans-serif;font-size:.95rem}
nav a:hover{color:var(--accent)}
.hero{padding:9vw 5vw 6vw;max-width:900px}
.hero h1{font-size:clamp(2rem,6vw,4rem);line-height:1.1;font-weight:700}
.hero p{margin-top:16px;color:var(--mute);font-size:1.15rem;max-width:560px}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:0 5vw 24px;font-family:system-ui,sans-serif}
.filters select,.filters input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;padding:0 5vw 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:system-ui,sans-serif}
.pic{height:170px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:600;background:linear-gradient(135deg,#2f5d73,#1d2226)}
.card .body{padding:16px}
.price{font-size:1.3rem;font-weight:700}
.meta{color:var(--mute);font-size:.9rem;margin-top:4px}
.card a.btn{display:inline-block;margin-top:12px;padding:8px 14px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:.9rem}
#empty{padding:0 5vw 60px;color:var(--mute);display:none;font-family:system-ui,sans-serif}
section.contact{padding:50px 5vw;border-top:1px solid var(--line);max-width:700px}
section.contact h2{margin-bottom:10px}
footer{padding:24px 5vw;color:var(--mute);font-family:system-ui,sans-serif;font-size:.85rem;border-top:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">Arthause Realty</a>
  <nav><a href="#listings">Объекты</a><a href="#contact">Контакты</a></nav>
</header>

<div class="hero">
  <h1>Квартиры и дома в Гюмри</h1>
  <p>Покупка и продажа недвижимости в Армении. Выберите объект или оставьте заявку.</p>
</div>

<div class="filters" id="listings">
  <select id="type"><option value="">Все типы</option><option>Квартира</option><option>Дом</option><option>Участок</option></select>
  <select id="rooms"><option value="">Комнаты</option><option value="1">1</option><option value="2">2</option><option value="3">3+</option></select>
  <input id="max" type="number" placeholder="Макс. цена, $" min="0">
</div>

<div class="grid" id="grid"></div>
<p id="empty">Ничего не найдено. Измените фильтры.</p>

<section class="contact" id="contact">
  <h2>Связаться с нами</h2>
  <p>Телефон: <a href="tel:+37400000000">+374 00 000 000</a><br>
  Email: <a href="mailto:info@example.com">info@example.com</a></p>
</section>

<footer>© <span id="y"></span> Arthause Realty. Гюмри, Армения.</footer>

<script>
// Редактируйте список объектов здесь
const listings=[
 {title:"3-комнатная квартира, центр",type:"Квартира",rooms:3,area:78,price:52000,addr:"ул. Горького"},
 {title:"2-комнатная квартира",type:"Квартира",rooms:2,area:55,price:34000,addr:"Шираки"},
 {title:"1-комнатная квартира",type:"Квартира",rooms:1,area:36,price:21000,addr:"Мушеги Тапа"},
 {title:"Дом с садом",type:"Дом",rooms:4,area:140,price:89000,addr:"Старый город"},
 {title:"Участок под строительство",type:"Участок",rooms:0,area:600,price:18000,addr:"Окраина Гюмри"},
 {title:"Дом из туфа",type:"Дом",rooms:3,area:95,price:64000,addr:"Кумайри"}
];
const $=id=>document.getElementById(id);
function render(){
  const t=$("type").value,r=$("rooms").value,m=+$("max").value;
  const list=listings.filter(l=>(!t||l.type===t)&&(!r||(r==="3"?l.rooms>=3:l.rooms==r))&&(!m||l.price<=m));
  $("grid").innerHTML=list.map(l=>`<article class="card">
    <div class="pic">${l.type}</div>
    <div class="body"><div class="price">$${l.price.toLocaleString("ru")}</div>
    <div>${l.title}</div>
    <div class="meta">${l.addr} · ${l.area} м²${l.rooms?` · ${l.rooms} комн.`:""}</div>
    <a class="btn" href="#contact">Узнать подробнее</a></div></article>`).join("");
  $("empty").style.display=list.length?"none":"block";
}
["type","rooms","max"].forEach(i=>$(i).addEventListener("input",render));
$("y").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
